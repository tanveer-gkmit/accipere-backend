name: Build and Deploy Docker Image

on:
  push:
    branches:
      - chore/github-action-setup
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: accipere-backend
  REGISTRY: docker.io

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Set up environment variables
        run: |
          echo "DEBUG=False" >> $GITHUB_ENV
          echo "SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> $GITHUB_ENV
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> $GITHUB_ENV
          echo "DATABASE_NAME=test_db" >> $GITHUB_ENV
          echo "DATABASE_USER=test_user" >> $GITHUB_ENV
          echo "DATABASE_PASSWORD=test_password" >> $GITHUB_ENV
          echo "DATABASE_HOST=localhost" >> $GITHUB_ENV
          echo "DATABASE_PORT=5432" >> $GITHUB_ENV
          echo "CORS_ALLOWED_ORIGINS=http://localhost:3000" >> $GITHUB_ENV
          echo "JWT_ACCESS_TOKEN_LIFETIME=60" >> $GITHUB_ENV
          echo "JWT_REFRESH_TOKEN_LIFETIME=1440" >> $GITHUB_ENV
          echo "MAX_UPLOAD_SIZE=5242880" >> $GITHUB_ENV
      
      - name: Run migrations
        run: python manage.py migrate --noinput
      
      - name: Run tests
        run: python manage.py test

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/github-action-setup'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/chore/github-action-setup'
    
    steps:
      - name: Deploy to EC2 instance
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            # Navigate to deployment directory
            cd /opt/accipere-backend || exit 1
            
            # Login to Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Capture current image BEFORE any docker operations
            CURRENT_IMAGE=$(docker inspect accipere-backend --format='{{.Config.Image}}' 2>/dev/null || echo "none")
            echo "Current image: $CURRENT_IMAGE"
            
            # Tag current image as rollback candidate (if exists)
            if [ "$CURRENT_IMAGE" != "none" ]; then
              docker tag "$CURRENT_IMAGE" ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:rollback-candidate
              echo "Tagged current image as rollback-candidate"
            fi
            
            # Pull latest image
            NEW_IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:chore-github-action-setup"
            docker pull "$NEW_IMAGE"
            
            # Stop and remove old container
            docker stop accipere-backend || true
            docker rm accipere-backend || true
            
            # Run new container
            docker run -d \
              --name accipere-backend \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file .env \
              -v /opt/accipere-backend/staticfiles:/app/staticfiles \
              -v /opt/accipere-backend/media:/app/media \
              "$NEW_IMAGE"
            
            # Wait for container to be ready
            sleep 10
            
            # Run migrations
            docker exec accipere-backend python manage.py migrate --noinput
            
            # Health check with retry
            echo "Performing health check..."
            HEALTH_CHECK_PASSED=false
            for i in {1..5}; do
              echo "Health check attempt $i/5..."
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health/ || echo "000")
              if [ "$RESPONSE" = "200" ]; then
                echo "Health check passed! (HTTP 200)"
                HEALTH_CHECK_PASSED=true
                break
              fi
              echo "Health check failed (HTTP $RESPONSE), retrying in 5 seconds..."
              sleep 5
            done
            
            # Rollback if health check failed
            if [ "$HEALTH_CHECK_PASSED" = false ]; then
              echo "Health check failed. Rolling back to previous version..."
              docker stop accipere-backend || true
              docker rm accipere-backend || true
              
              ROLLBACK_IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:rollback-candidate"
              if docker image inspect "$ROLLBACK_IMAGE" > /dev/null 2>&1; then
                echo "Restoring previous container with image: $ROLLBACK_IMAGE"
                docker run -d \
                  --name accipere-backend \
                  --restart unless-stopped \
                  -p 8000:8000 \
                  --env-file .env \
                  -v /opt/accipere-backend/staticfiles:/app/staticfiles \
                  -v /opt/accipere-backend/media:/app/media \
                  "$ROLLBACK_IMAGE"
                
                # Wait and verify rollback
                sleep 10
                docker exec accipere-backend python manage.py migrate --noinput || true
                echo "Rollback completed"
              else
                echo "No previous image available for rollback"
              fi
              
              docker logout
              exit 1
            fi
            
            # Success - clean up rollback candidate and old images
            docker rmi "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:rollback-candidate" 2>/dev/null || true
            docker image prune -af --filter "until=72h"
            
            docker logout
