name: Security Scan on PR

on:
  pull_request:

jobs:
  semgrep_scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Run Semgrep scan
      uses: returntocorp/semgrep-action@v1.11.0
      with:
        config: "p/ci" # Official CI ruleset
        severity-threshold: "WARNING" # Fail on warning or above

  trivy_scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.29.0
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-results.sarif
        exit-code: '1'  # Fail job on vulnerability findings

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif
